plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
}

version = mod_version
group = 'gdavid.phi'

base {
    archivesName = 'phi'
}

// Minecraft 1.21.1 requires Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Access transformers
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven { url = "https://maven.blamejared.com/" }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    compileOnly "vazkii.psi:psi:${psi_version}"
    runtimeOnly "vazkii.psi:psi:${psi_version}"

    runtimeOnly "vazkii.patchouli:Patchouli:${patchouli_version}"
}

// Run configurations
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        workingDirectory project.file('run')

        modSource project.sourceSets.main
    }

    client {
    }

    server {
        argument '--nogui'
    }

    data {
        arguments.addAll '--mod', 'phi', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "phi",
                "Specification-Vendor"    : "gdavid",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "gdavid",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
